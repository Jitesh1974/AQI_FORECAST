services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aircast-backend
    restart: unless-stopped
    environment:
      FRONTEND_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      MODEL_PATH: "/app/backend/artifacts/model.joblib"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aircast-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
